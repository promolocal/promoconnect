<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Join PromoConnect</title>
<meta name="description" content="Create a free PromoConnect account as a creator or a homegrown brand.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="auth.css">
</head>
<body>

<header class="top">
  <a class="mark" href="index.html">PromoConnect</a>
  <a class="top-link" href="login.html">Log in</a>
</header>

<main class="wrap">
  <h1>Join PromoConnect</h1>
  <p class="lede">Free for creators. Homegrown brands get their first collabs free. We'll message you on WhatsApp when we have a match.</p>

  <form id="signup" class="card" novalidate>
    <fieldset class="switch" aria-label="Account type">
      <input type="radio" name="role" id="role-creator" value="creator" checked>
      <label for="role-creator">I'm a creator</label>
      <input type="radio" name="role" id="role-brand" value="brand">
      <label for="role-brand">I'm a brand</label>
    </fieldset>

    <div id="message" class="msg" role="alert" aria-live="polite" hidden></div>

    <div class="field">
      <label for="full_name">Your name</label>
      <input type="text" id="full_name" name="full_name" autocomplete="name" maxlength="120" required>
    </div>

    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="200" required>
    </div>

    <div class="field">
      <label for="whatsapp">WhatsApp number
        <span class="hint">With country code, like +91 98765 43210</span>
      </label>
      <input type="tel" id="whatsapp" name="whatsapp" autocomplete="tel" inputmode="tel"
             pattern="\+?[0-9 \-]{10,18}" title="Enter your number with country code, for example +91 98765 43210" required>
    </div>

    <div class="field">
      <label for="city">City</label>
      <input type="text" id="city" name="city" autocomplete="address-level2" maxlength="80" required>
    </div>

    <!-- Creator-only questions -->
    <fieldset class="group" id="group-creator">
      <div class="field">
        <label for="instagram">Instagram handle
          <span class="hint">Your account must be public</span>
        </label>
        <input type="text" id="instagram" name="instagram" placeholder="@yourhandle"
               maxlength="31" pattern="@?[A-Za-z0-9._]{1,30}" title="Letters, numbers, dots and underscores only" required>
      </div>

      <div class="row two">
        <div class="field">
          <label for="niche">Your niche</label>
          <select id="niche" name="niche" required>
            <option value="" selected disabled>Choose one</option>
            <option>Skincare</option>
            <option>Beauty</option>
            <option>Fashion</option>
            <option>Fitness</option>
            <option>Food</option>
            <option>Lifestyle</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="followers">Followers</label>
          <input type="number" id="followers" name="followers" min="0" max="100000000" inputmode="numeric" required>
        </div>
      </div>

      <div class="field">
        <label for="language">Main language of your posts</label>
        <select id="language" name="language" required>
          <option value="" selected disabled>Choose one</option>
          <option>English</option>
          <option>Hindi</option>
          <option>Marathi</option>
          <option>Tamil</option>
          <option>Telugu</option>
          <option>Bengali</option>
          <option>Gujarati</option>
          <option>Kannada</option>
          <option>Malayalam</option>
          <option>Punjabi</option>
          <option>Other</option>
        </select>
      </div>

      <label class="check">
        <input type="checkbox" name="age_confirmed" value="true" required>
        <span>I am 18 or older and my Instagram account is public.</span>
      </label>
    </fieldset>

    <!-- Brand-only questions -->
    <fieldset class="group" id="group-brand" hidden disabled>
      <div class="field">
        <label for="brand_name">Brand name</label>
        <input type="text" id="brand_name" name="brand_name" maxlength="120" required>
      </div>

      <div class="field">
        <label for="website">Website or Instagram page
          <span class="hint">A link to your brand</span>
        </label>
        <input type="text" id="website" name="website" maxlength="200" required>
      </div>

      <div class="row two">
        <div class="field">
          <label for="category">Product category</label>
          <select id="category" name="category" required>
            <option value="" selected disabled>Choose one</option>
            <option>Skincare</option>
            <option>Beauty</option>
            <option>Fashion</option>
            <option>Fitness</option>
            <option>Food</option>
            <option>Home and lifestyle</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="country">Brand is based in</label>
          <select id="country" name="country" required>
            <option selected>India</option>
            <option>Outside India</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="product">Product you want creators to review</label>
        <input type="text" id="product" name="product" maxlength="160" required>
      </div>
    </fieldset>

    <div class="field">
      <label for="password">Password
        <span class="hint">At least 8 characters</span>
      </label>
      <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required>
    </div>

    <label class="check">
      <input type="checkbox" name="consent" value="true" required>
      <span>I agree to the <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>, and to be contacted on WhatsApp and email about collabs.</span>
    </label>

    <button class="btn" type="submit" id="submit">Create my account</button>
    <p class="fine">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function () {
  var cfg = window.PC_CONFIG || {};
  var connected = cfg.SUPABASE_URL && cfg.SUPABASE_ANON_KEY &&
                  cfg.SUPABASE_URL.indexOf("PASTE") === -1 && cfg.SUPABASE_ANON_KEY.indexOf("PASTE") === -1;
  var sb = connected && window.supabase ? window.supabase.createClient(cfg.SUPABASE_URL, cfg.SUPABASE_ANON_KEY) : null;

  var form = document.getElementById("signup");
  var message = document.getElementById("message");
  var submit = document.getElementById("submit");
  var groups = {
    creator: document.getElementById("group-creator"),
    brand: document.getElementById("group-brand")
  };

  function show(text, kind) {
    message.textContent = text;
    message.className = "msg " + kind;
    message.hidden = false;
    message.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  function setRole(role) {
    Object.keys(groups).forEach(function (key) {
      var on = key === role;
      groups[key].hidden = !on;
      groups[key].disabled = !on;
    });
    document.getElementById("role-" + role).checked = true;
  }

  // Role can come from the link: signup.html?role=brand
  var wanted = new URLSearchParams(location.search).get("role");
  setRole(wanted === "brand" ? "brand" : "creator");

  form.addEventListener("change", function (e) {
    if (e.target.name === "role") setRole(e.target.value);
  });

  form.addEventListener("submit", function (e) {
    e.preventDefault();
    message.hidden = true;

    if (!sb) {
      show("Signup isn't connected yet. Please try again soon or message us on Instagram @promoconnect.in.", "error");
      return;
    }
    if (!form.reportValidity()) return;

    var data = {};
    new FormData(form).forEach(function (value, key) {
      if (key !== "email" && key !== "password") data[key] = String(value).trim();
    });
    data.whatsapp = data.whatsapp.replace(/[\s-]/g, "");
    if (data.instagram) data.instagram = data.instagram.replace(/^@/, "");

    var email = form.email.value.trim();
    var password = form.password.value;

    submit.disabled = true;
    submit.textContent = "Creating your account...";

    sb.auth.signUp({
      email: email,
      password: password,
      options: {
        data: data,
        emailRedirectTo: new URL("login.html", location.href).href
      }
    }).then(function (result) {
      submit.disabled = false;
      submit.textContent = "Create my account";

      if (result.error) {
        var text = result.error.message || "";
        if (/already/i.test(text)) {
          show("This email already has an account. Log in instead.", "error");
        } else if (/password/i.test(text)) {
          show("Choose a stronger password with at least 8 characters.", "error");
        } else if (/rate|too many|limit/i.test(text)) {
          show("Too many attempts. Wait a few minutes and try again.", "error");
        } else {
          show("We couldn't create your account. Check your details and try again.", "error");
        }
        return;
      }

      var user = result.data && result.data.user;
      if (user && user.identities && user.identities.length === 0) {
        show("This email already has an account. Log in instead.", "error");
        return;
      }

      form.reset();
      setRole("creator");
      show("Account created. Check your email and tap the confirmation link, then log in.", "ok");
    }).catch(function () {
      submit.disabled = false;
      submit.textContent = "Create my account";
      show("Something went wrong with your connection. Try again.", "error");
    });
  });
})();
</script>
</body>
</html>
